name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      # Secret yang belum di-set tetap diteruskan GitHub Actions sebagai STRING
      # KOSONG, bukan "tidak ada". Kalau string kosong itu masuk ke env build,
      # Nuxt meng-override runtimeConfig.public jadi "" — dan override itu
      # berjalan SETELAH nuxt.config.ts dievaluasi, sehingga default
      # `process.env.X || '<default>'` di sana tidak akan pernah menang.
      # Itulah yang bikin form live berhenti di "Belum Bisa Kirim Online"
      # (sheetEndpoint:"") walaupun captcha-nya sudah lolos.
      #
      # Jadi secret hanya diteruskan kalau benar-benar berisi. Kalau kosong,
      # env var-nya sama sekali tidak dibuat dan default di nuxt.config.ts dipakai.
      - name: Teruskan secret hanya jika tidak kosong
        env:
          SHEET_ENDPOINT: ${{ secrets.NUXT_PUBLIC_SHEET_ENDPOINT }}
          CAPTCHA_SITE_KEY: ${{ secrets.NUXT_PUBLIC_CAPTCHA_SITE_KEY }}
        run: |
          if [ -n "$SHEET_ENDPOINT" ]; then
            echo "NUXT_PUBLIC_SHEET_ENDPOINT=$SHEET_ENDPOINT" >> "$GITHUB_ENV"
          fi
          if [ -n "$CAPTCHA_SITE_KEY" ]; then
            echo "NUXT_PUBLIC_CAPTCHA_SITE_KEY=$CAPTCHA_SITE_KEY" >> "$GITHUB_ENV"
          fi

      # Custom domain sanggarindahparahyangan.com menyajikan situs di ROOT, bukan
      # di sub-folder /landing-page-sipar/ seperti waktu masih di github.io. Jadi
      # NUXT_APP_BASE_URL sengaja TIDAK di-set di sini supaya baseURL jatuh ke '/'
      # (default di nuxt.config.ts). Kalau baris itu dihidupkan lagi, semua aset
      # yang lewat withBase() akan menunjuk ke /landing-page-sipar/... dan 404.
      - run: npm run generate

      # Pengaman: build yang endpoint-nya kosong tidak boleh sampai ter-deploy,
      # karena gejalanya diam-diam (form tampak normal sampai user menekan kirim).
      - name: Pastikan endpoint ter-bake di hasil build
        run: |
          if grep -rq 'sheetEndpoint:""' .output/public; then
            echo "::error::sheetEndpoint kosong di hasil build — form tidak akan bisa mengirim data."
            exit 1
          fi
          echo "OK: sheetEndpoint terisi."

      # Pengaman sejenis untuk base path. Sisa '/landing-page-sipar/' di hasil build
      # berarti baseURL lama ikut ter-bake, dan di custom domain semua aset itu 404.
      # Gejalanya diam-diam juga: HTML tetap tampil, hanya gambar & JS-nya hilang.
      - name: Pastikan base path root, bukan sub-folder lama
        run: |
          # --exclude='*.map': path checkout runner sendiri mengandung
          # '/landing-page-sipar/', jadi sourcemap (kalau nanti diaktifkan)
          # akan memicu false positive.
          if grep -rq --exclude='*.map' '/landing-page-sipar/' .output/public; then
            echo "::error::Base path lama masih ada di hasil build — aset akan 404 di custom domain."
            grep -rl --exclude='*.map' '/landing-page-sipar/' .output/public | head
            exit 1
          fi
          echo "OK: base path sudah root."

      # CNAME wajib ikut ter-deploy supaya GitHub Pages tetap mengenali custom
      # domain-nya setiap kali artifact baru menimpa yang lama.
      - name: Pastikan CNAME ikut ter-deploy
        run: |
          if [ ! -f .output/public/CNAME ]; then
            echo "::error::CNAME tidak ada di hasil build — custom domain bisa ter-reset."
            exit 1
          fi
          echo "OK: CNAME = $(cat .output/public/CNAME)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
